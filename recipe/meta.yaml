{% set name = "perl-test-without-module" %}
{% set version = "0.23" %}
{% set sha256 = "8289e1cd7f57017a816ab4127e29ecd7a754ae7cd5c037c41b3b3bf849c21d21" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/C/CO/CORION/Test-Without-Module-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  script:
    - perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1
    - make
    - make test
    - make install VERBINST=1

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
  run:
    - perl

test:
  imports:
    - Test::Without::Module

about:
  home: https://metacpan.org/dist/Test-Without-Module
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_family: OTHER
  summary: 'Test fallback behaviour in absence of modules'
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cbrueffer
